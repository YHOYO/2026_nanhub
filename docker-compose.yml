services:
  nanproxy:
    build: .
    container_name: nanproxy
    ports:
      - "8080:8080"
    volumes:
      # Persist database (NaN Cloud uses /data)
      - ./data:/data
      # Persist logs
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s